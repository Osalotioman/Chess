name: Deploy Container

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:                           
      DEPLOY_HOST: drid-uniben.org
      DEPLOY_USER: github-drid-deploy-user
      BUILD_REQUIRED: 1

    steps:
      - name: Determine if build is needed
        id: check_build
        run: |
          if git diff --name-only ${{ github.sha }}~1 ${{ github.sha }} | grep -E 'client|ws-server|.'; then
            echo "BUILD_REQUIRED=1" >> $GITHUB_ENV
          fi
          echo "Build required: $BUILD_REQUIRED"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/osalotioman/chess

          docker buildx build \
            --push \
            -t $IMAGE:${GITHUB_SHA} \
            -t $IMAGE:latest \
            .
                 
