name: Deploy Container

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    env:                           
      DEPLOY_HOST: drid-uniben.org
      DEPLOY_USER: github-drid-deploy-user
      BUILD_REQUIRED: 1

    steps:
      - name: Determine if build is needed
        id: check_build
        run: |
          if git diff --name-only ${{ github.sha }}~1 ${{ github.sha }} | grep -E 'client|ws-server|.'; then
            echo "BUILD_REQUIRED=1" >> $GITHUB_ENV
          fi
          echo "Build required: $BUILD_REQUIRED"

      - name: Checkout code
        if: env.BUILD_REQUIRED == '1'
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        if: env.BUILD_REQUIRED == '1'
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        if: env.BUILD_REQUIRED == '1'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        if: env.BUILD_REQUIRED == '1'
        run: |
          IMAGE=ghcr.io/osalotioman/chess

          docker buildx build \
            --push \
            -t $IMAGE:${GITHUB_SHA} \
            -t $IMAGE:latest \
            .
                  
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v0.1.9
              with:
                host: ${{ env.DEPLOY_HOST }}
                username: ${{ env.DEPLOY_USER }}
                key: ${{ secrets.DEPLOY_KEY }}
                script: |
                  cd osalotioman-chess
                  ./deploy-osalotioman-chess.sh 