name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: ws-server install
        run: pnpm -C ws-server install --frozen-lockfile

      - name: ws-server typecheck
        run: pnpm -C ws-server typecheck

      - name: ws-server build
        run: pnpm -C ws-server build

      - name: client install
        run: pnpm -C client install --frozen-lockfile

      - name: client build
        run: pnpm -C client build
