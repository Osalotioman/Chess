services:
  ws-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WS_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      API_SERVER_ORIGIN: ${API_SERVER_ORIGIN:-http://host.docker.internal:4000}
      INTERNAL_WS_SHARED_SECRET: ${INTERNAL_WS_SHARED_SECRET:-change-this-internal-secret}
