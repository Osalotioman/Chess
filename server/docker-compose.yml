services:
  chess-ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      # Mount server folder for dev editing
      - .:/app
      # Keep container-managed vendor to avoid host/vendor mismatch
      - /app/vendor
    restart: unless-stopped
    command: php src/server.php

  # Separate service for running tests without stopping the server
  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/app
      - /app/vendor
    command: ./vendor/bin/phpunit --configuration phpunit.xml