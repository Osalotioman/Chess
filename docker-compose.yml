services:
  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    ports:
      - "${WS_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8081
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - ws-server
    restart: unless-stopped
